# alembic.ini
# Минимальная конфигурация для асинхронного SQLite / Postgres

[alembic]
# Папка с миграциями
script_location = alembic

# URL подключения переопределяется в env.py из .env
sqlalchemy.url = sqlite+aiosqlite:///database.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
